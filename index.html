<style>
:root{--bg:#070a0f;--card:#111823;--linha:#1f2a38;--txt:#e9edf3;--sub:#93a0b2;--ciano:#00e5ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#12202c,var(--bg) 60%);color:var(--txt);
font:16px/1.5 "Source Sans 3",system-ui,sans-serif;min-height:100vh;padding:32px 16px 48px}
main{max-width:520px;margin:0 auto;display:grid;gap:14px;text-align:center}
img{width:112px;height:112px;border-radius:50%;margin:0 auto;box-shadow:0 0 40px #00e5ff44}
h1{font:800 30px/1.1 Unbounded,sans-serif;margin:6px 0 0;letter-spacing:.02em}h1 span{color:var(--ciano)}
.bio{color:var(--sub);margin:0}
.redes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rede{padding:8px 16px;border:1px solid var(--linha);border-radius:99px;color:var(--txt);text-decoration:none;font-weight:600}
.rede:hover,.rede:focus-visible{border-color:var(--ciano);outline:none}
h2{font:800 15px/1 Unbounded,sans-serif;letter-spacing:.08em;color:var(--ciano);margin:22px 0 4px;text-align:left}
.lista{display:grid;gap:10px}
.prod{display:grid;gap:2px;text-align:left;padding:14px 16px;background:var(--card);border:1px solid var(--linha);
border-radius:12px;color:var(--txt);text-decoration:none;transition:border-color .15s,transform .15s}
.prod:hover,.prod:focus-visible{border-color:var(--ciano);transform:translateY(-1px);outline:none}
.prod span{color:var(--sub);font-size:15px}
.aviso{color:var(--sub);font-size:13px;margin-top:26px}
